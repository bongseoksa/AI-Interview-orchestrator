<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Office</title>
<style>
:root {
  --bg: #1a1b2e;
  --surface: #252640;
  --surface2: #2d2e4a;
  --text: #e0e0e8;
  --dim: #8888a0;
  --accent: #6c8cff;
  --green: #4caf84;
  --red: #e05555;
  --orange: #e89040;
  --yellow: #e8c840;
  --msg-font-size: 13px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 13px; }

/* ── Header ── */
#header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--surface2); }
#header h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.5px; }
#header .stat { color: var(--dim); font-size: 12px; }
#header .stat b { color: var(--text); }

/* ── Main ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Floor (left) ── */
#floor { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
#desks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.desk { background: var(--surface); border-radius: 8px; padding: 12px; border: 2px solid transparent; transition: all 0.3s; min-height: 80px; cursor: pointer; }
.desk:hover { background: var(--surface2); }
.desk.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,140,255,0.2); }
.desk.error { border-color: var(--red); }
.desk .role { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desk .crew-tag { font-size: 10px; color: var(--dim); }
.desk .status-icon { font-size: 20px; margin: 4px 0; }
.desk .speech { font-size: 10px; color: var(--dim); margin-top: 4px; max-height: 32px; overflow: hidden; text-overflow: ellipsis; }

/* ── Meeting room ── */
#meeting { background: var(--surface); border-radius: 8px; padding: 12px; border: 1px solid var(--surface2); min-height: 80px; }
#meeting h3 { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
#meeting-content { font-size: 11px; }

/* ── Control bar ── */
#controls { padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--surface2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#controls button { background: var(--surface2); color: var(--text); border: 1px solid var(--dim); border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
#controls button:hover { background: var(--accent); border-color: var(--accent); }
#controls button:disabled { opacity: 0.3; cursor: not-allowed; }
#controls button.running { background: var(--orange); border-color: var(--orange); color: #000; }

/* ── Messenger (right) ── */
#messenger { width: 360px; background: var(--surface); border-left: 1px solid var(--surface2); display: flex; flex-direction: column; }
#messenger-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--surface2); }
#messenger-header h3 { font-size: 13px; font-weight: 700; }
#messenger-header .font-controls { display: flex; gap: 4px; align-items: center; }
#messenger-header .font-controls button { background: none; border: 1px solid var(--dim); color: var(--dim); border-radius: 3px; padding: 1px 6px; font-size: 11px; cursor: pointer; font-family: inherit; }
#messenger-header .font-controls button:hover { color: var(--text); border-color: var(--text); }

#msg-list { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }

/* ── Message types ── */
.msg { font-size: var(--msg-font-size); line-height: 1.5; }
.msg .name { font-weight: 700; font-size: calc(var(--msg-font-size) - 1px); margin-bottom: 2px; }
.msg .bubble { padding: 8px 12px; border-radius: 8px; max-width: 100%; word-break: break-word; }

/* Agent speech (main output) */
.msg.speech .bubble { background: var(--surface2); border: 1px solid rgba(255,255,255,0.06); border-radius: 2px 8px 8px 8px; }

/* LLM thinking (inner monologue) */
.msg.thinking .bubble { background: rgba(108,140,255,0.08); border: 1px dashed rgba(108,140,255,0.2); color: var(--dim); font-style: italic; border-radius: 2px 8px 8px 8px; }

/* System messages (tool, crew, task) */
.msg.system { text-align: center; padding: 4px 0; }
.msg.system .bubble { display: inline-block; background: none; padding: 2px 12px; font-size: calc(var(--msg-font-size) - 2px); color: var(--dim); border: none; }

/* Crew banner */
.msg.crew-banner { text-align: center; padding: 8px 0; }
.msg.crew-banner .bubble { display: inline-block; background: rgba(76,175,132,0.12); border: 1px solid rgba(76,175,132,0.3); color: var(--green); padding: 4px 16px; border-radius: 12px; font-weight: 600; font-size: calc(var(--msg-font-size) - 1px); }
.msg.crew-banner.error .bubble { background: rgba(224,85,85,0.12); border-color: rgba(224,85,85,0.3); color: var(--red); }

/* Error message */
.msg.error-msg .bubble { background: rgba(224,85,85,0.1); border: 1px solid rgba(224,85,85,0.25); color: var(--red); border-radius: 2px 8px 8px 8px; }

/* Separator */
.msg-separator { border: none; border-top: 1px solid var(--surface2); margin: 8px 0; }

/* Auto-scroll button */
#scroll-btn { display: none; position: sticky; bottom: 0; align-self: center; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 4px 14px; font-size: 11px; cursor: pointer; font-family: inherit; margin-top: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
#scroll-btn.visible { display: block; }

/* status icons */
.s-idle::before { content: '\1F4A4'; }
.s-working::before { content: '\2328\FE0F'; }
.s-thinking::before { content: '\1F4AD'; }
.s-speaking::before { content: '\1F4AC'; }
.s-tool::before { content: '\1F527'; }
.s-error::before { content: '\26A0\FE0F'; }
.s-done::before { content: '\2705'; }
</style>
</head>
<body>

<div id="header">
  <h1>AI Interview Office</h1>
  <span class="stat" id="timer"></span>
  <span class="stat" id="tokens"></span>
  <span class="stat" id="conn-status">connecting...</span>
</div>

<div id="main">
  <div id="floor">
    <div id="desks"></div>
    <div id="meeting"><h3>Meeting Room</h3><div id="meeting-content"><span style="color:var(--dim)">No active crew</span></div></div>
  </div>
  <div id="messenger">
    <div id="messenger-header">
      <h3>Office Messenger</h3>
      <div class="font-controls">
        <button onclick="changeFontSize(-1)">A-</button>
        <button onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div id="msg-list"></div>
    <button id="scroll-btn" onclick="scrollToBottom()">Latest</button>
  </div>
</div>

<div id="controls">
  <span style="color:var(--dim);font-size:11px;margin-right:8px;">Crews:</span>
</div>

<script>
const WS_URL = `ws://${location.host}/ws/office`;

// ── Agent color map ──
const AGENT_COLORS = {};
function agentColor(role) {
  if (!role) return 'var(--dim)';
  if (AGENT_COLORS[role]) return AGENT_COLORS[role];
  let hash = 0;
  for (let i = 0; i < role.length; i++) hash = role.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  AGENT_COLORS[role] = `hsl(${hue}, 60%, 65%)`;
  return AGENT_COLORS[role];
}

// ── State ──
const state = {
  agents: {},
  totalTokens: 0,
  activeCrew: null,
  startTime: null,
  autoScroll: true,
};

// ── Init ──
async function init() {
  const [agents, crews] = await Promise.all([
    fetch('/api/agents').then(r => r.json()),
    fetch('/api/crews').then(r => r.json()),
  ]);

  const desksEl = document.getElementById('desks');
  const crewMap = {
    'strategy-manager': 'Research', 'product-manager': 'Planning', 'project-manager': 'Planning',
    'fullstack-architect': 'Architect', 'backend-senior': 'Architect',
    'frontend-senior': 'Frontend', 'qa-engineer': 'QA', 'infra-expert': 'Infra',
    'data-engineer': 'Data', 'doc-secretary': 'Documentation', 'external-advisor': 'Review',
    'codegen-developer': 'Codegen', 'notion-editor': 'NotionEdit',
  };

  agents.forEach(a => {
    const id = a.agent_id || a.role;
    const role = a.role || id;
    const crew = a.crew || crewMap[a.agent_id] || '';
    const el = document.createElement('div');
    el.className = 'desk';
    el.innerHTML = `<div class="role" title="${role}" style="color:${agentColor(role)}">${role}</div><div class="crew-tag">${crew}</div><div class="status-icon s-idle"></div><div class="speech"></div>`;
    desksEl.appendChild(el);
    state.agents[role] = { role, crew, status: 'idle', speech: '', desk_el: el, icon_el: el.querySelector('.status-icon'), speech_el: el.querySelector('.speech') };
  });

  const ctrlEl = document.getElementById('controls');
  crews.forEach(c => {
    if (['codegen', 'notion-edit', 'notion'].includes(c.name)) return;
    const btn = document.createElement('button');
    btn.textContent = c.name;
    btn.title = c.description;
    btn.onclick = () => runCrew(c.name, btn);
    ctrlEl.appendChild(btn);
  });

  // Auto-scroll detection
  const msgList = document.getElementById('msg-list');
  msgList.addEventListener('scroll', () => {
    const atBottom = msgList.scrollHeight - msgList.scrollTop - msgList.clientHeight < 60;
    state.autoScroll = atBottom;
    document.getElementById('scroll-btn').classList.toggle('visible', !atBottom);
  });

  connectWS();
}

// ── WebSocket ──
function connectWS() {
  const ws = new WebSocket(WS_URL);
  const statusEl = document.getElementById('conn-status');
  ws.onopen = () => { statusEl.textContent = 'connected'; statusEl.style.color = 'var(--green)'; };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; statusEl.style.color = 'var(--red)'; setTimeout(connectWS, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
}

// ── Event Handler ──
function handleEvent(ev) {
  const [cat, action] = ev.type.split('.');

  // Messenger
  addMessage(ev, cat, action);

  // Desk states
  if (cat === 'crew') {
    if (action === 'started') {
      state.activeCrew = ev.crew;
      state.startTime = Date.now();
      updateTimer();
      updateMeeting(ev.crew, 'In progress...');
    } else if (action === 'completed' || action === 'failed') {
      if (ev.payload?.tokens?.total) state.totalTokens += ev.payload.tokens.total;
      updateMeeting(ev.crew, action === 'completed' ? 'Completed' : `Failed: ${ev.payload?.error || ''}`);
      state.activeCrew = null;
      state.startTime = null;
      resetAllDesks();
      updateButtons(false);
    }
    updateTokens();
  }

  if (cat === 'agent') {
    const a = findAgent(ev.agent);
    if (!a) return;
    if (action === 'started') setAgentStatus(a, 'working');
    else if (action === 'completed') {
      setAgentStatus(a, 'speaking');
      a.speech = truncate(ev.payload?.text, 80);
      a.speech_el.textContent = a.speech;
      setTimeout(() => setAgentStatus(a, 'idle'), 3000);
    }
    else if (action === 'error') setAgentStatus(a, 'error');
  }

  if (cat === 'tool') {
    const a = findAgent(ev.agent);
    if (!a) return;
    if (action === 'started') setAgentStatus(a, 'tool');
    else if (action === 'finished') setAgentStatus(a, 'working');
    else if (action === 'error') setAgentStatus(a, 'error');
  }

  if (cat === 'llm') {
    if (ev.payload?.tokens) {
      const t = ev.payload.tokens;
      if (t.prompt) state.totalTokens += t.prompt;
      if (t.completion) state.totalTokens += t.completion;
      updateTokens();
    }
  }
}

// ── Messenger rendering ──
function addMessage(ev, cat, action) {
  const list = document.getElementById('msg-list');

  if (cat === 'crew') {
    if (action === 'started') {
      list.appendChild(createSeparator());
      list.appendChild(createCrewBanner(`${ev.crew} meeting started`));
    } else if (action === 'completed') {
      const elapsed = ev.payload?.elapsed_sec ? ` (${Math.round(ev.payload.elapsed_sec)}s)` : '';
      list.appendChild(createCrewBanner(`${ev.crew} completed${elapsed}`));
      list.appendChild(createSeparator());
    } else if (action === 'failed') {
      list.appendChild(createCrewBanner(`${ev.crew} FAILED: ${ev.payload?.error || 'unknown'}`, true));
      list.appendChild(createSeparator());
    }
  }

  else if (cat === 'agent') {
    if (action === 'completed' && ev.payload?.text) {
      list.appendChild(createSpeechBubble(ev.agent, ev.payload.text));
    } else if (action === 'error') {
      list.appendChild(createErrorBubble(ev.agent, ev.payload?.error || 'Unknown error'));
    }
    // agent.started → no message (too noisy)
  }

  else if (cat === 'llm') {
    if (action === 'completed' && ev.payload?.text) {
      list.appendChild(createThinkingBubble(ev.agent || state.activeCrew, ev.payload.text));
    }
  }

  else if (cat === 'tool') {
    if (action === 'started') {
      list.appendChild(createSystemMsg(`${shortName(ev.agent)} uses ${ev.tool || 'tool'}`));
    } else if (action === 'error') {
      list.appendChild(createErrorBubble(ev.agent, `Tool ${ev.tool}: ${ev.payload?.error || 'error'}`));
    }
    // tool.finished → skip (too noisy)
  }

  else if (cat === 'task') {
    if (action === 'started') {
      list.appendChild(createSystemMsg(`Task: ${truncate(ev.task, 60)}`));
    } else if (action === 'completed') {
      const file = ev.payload?.output_file ? ` → ${ev.payload.output_file}` : '';
      list.appendChild(createSystemMsg(`Task completed (${ev.payload?.output_len || 0} chars)${file}`));
    } else if (action === 'failed') {
      list.appendChild(createSystemMsg(`Task FAILED: ${truncate(ev.payload?.error, 80)}`));
    }
  }

  if (state.autoScroll) scrollToBottom();
}

function createSpeechBubble(agent, text) {
  const el = document.createElement('div');
  el.className = 'msg speech';
  el.innerHTML = `<div class="name" style="color:${agentColor(agent)}">${escHtml(shortName(agent))}</div><div class="bubble">${escHtml(truncate(text, 500))}</div>`;
  return el;
}

function createThinkingBubble(agent, text) {
  const el = document.createElement('div');
  el.className = 'msg thinking';
  el.innerHTML = `<div class="name" style="color:${agentColor(agent)}">${escHtml(shortName(agent))}</div><div class="bubble">(${escHtml(truncate(text, 300))})</div>`;
  return el;
}

function createErrorBubble(agent, text) {
  const el = document.createElement('div');
  el.className = 'msg error-msg';
  el.innerHTML = `<div class="name" style="color:var(--red)">${escHtml(shortName(agent))}</div><div class="bubble">${escHtml(text)}</div>`;
  return el;
}

function createSystemMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg system';
  el.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  return el;
}

function createCrewBanner(text, isError = false) {
  const el = document.createElement('div');
  el.className = 'msg crew-banner' + (isError ? ' error' : '');
  el.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  return el;
}

function createSeparator() {
  return document.createElement('hr');
}

function shortName(role) {
  if (!role) return '?';
  // Extract Korean name or abbreviate
  const match = role.match(/^(.+?)\s*\(/);
  return match ? match[1] : role.split(' ').slice(0, 2).join(' ');
}

// ── Helpers ──
function findAgent(role) {
  if (!role) return null;
  return state.agents[role] || Object.values(state.agents).find(a => role.includes(a.role) || a.role.includes(role));
}

function setAgentStatus(a, status) {
  a.status = status;
  a.icon_el.className = 'status-icon s-' + ({working:'working', thinking:'thinking', speaking:'speaking', tool:'tool', error:'error', idle:'idle'}[status] || 'idle');
  a.desk_el.classList.toggle('active', status !== 'idle');
  a.desk_el.classList.toggle('error', status === 'error');
}

function resetAllDesks() { Object.values(state.agents).forEach(a => setAgentStatus(a, 'idle')); }

function truncate(s, n) { if (!s) return ''; s = String(s); return s.length > n ? s.slice(0, n) + '...' : s; }

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function updateTokens() {
  document.getElementById('tokens').innerHTML = `Tokens: <b>${(state.totalTokens/1000).toFixed(1)}k</b>`;
}

function updateMeeting(crew, text) {
  document.getElementById('meeting-content').innerHTML = `<b>${crew || ''}</b> — ${escHtml(text)}`;
}

let timerInterval;
function updateTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.startTime) { document.getElementById('timer').textContent = ''; return; }
    const s = Math.floor((Date.now() - state.startTime) / 1000);
    const m = Math.floor(s / 60);
    document.getElementById('timer').innerHTML = `<b>${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</b>`;
  }, 1000);
}

function scrollToBottom() {
  const list = document.getElementById('msg-list');
  list.scrollTop = list.scrollHeight;
  state.autoScroll = true;
  document.getElementById('scroll-btn').classList.remove('visible');
}

function changeFontSize(delta) {
  const current = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--msg-font-size'));
  const next = Math.max(10, Math.min(20, current + delta));
  document.documentElement.style.setProperty('--msg-font-size', next + 'px');
}

// ── Crew execution ──
async function runCrew(name, btn) {
  const res = await fetch(`/api/run/${name}`, {method:'POST'});
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  updateButtons(true);
  btn.classList.add('running');
}

function updateButtons(busy) {
  document.querySelectorAll('#controls button').forEach(b => { b.disabled = busy; if (!busy) b.classList.remove('running'); });
}

init();
</script>
</body>
</html>
