<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Office</title>
<link rel="stylesheet" href="/static/office.css">
</head>
<body>

<div id="header">
  <h1>AI Interview Office</h1>
  <span class="stat" id="timer"></span>
  <span class="stat" id="tokens"></span>
  <span class="stat" id="queue"></span>
  <span class="stat" id="conn-status">connecting...</span>
  <button onclick="toggleTheme()" style="margin-left:auto;background:none;border:1px solid var(--dim);color:var(--dim);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit" id="theme-btn">Light</button>
</div>

<div id="main">
  <div id="floor">
    <!-- 방·복도·문은 office.js의 ZONES 좌표에서 그린다. 여기엔 빈 층만 둔다. -->
    <div id="floorplan">
      <div id="meeting-info"><div class="mi-crew" id="meeting-crew">No active crew</div></div>
      <div id="agent-layer"></div>
    </div>
  </div>
  <div id="messenger">
    <div id="messenger-header">
      <h3>Office Messenger</h3>
      <div class="font-controls">
        <button onclick="changeFontSize(-1)">A-</button>
        <button onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div id="msg-list">
      <div id="msg-empty">
        <div class="me-title">사내 메신저처럼 지시하세요</div>
        <p>담당자를 정하면 <b>작업</b>, 여러 명을 부르면 <b>회의</b>가 됩니다.<br>
           회의가 끝나면 회의록과 결정사항 초안이 올라오고, 승인하면 노션에 기록됩니다.</p>
      </div>
    </div>
    <button id="scroll-btn" onclick="scrollToBottom()">Latest</button>
    <div id="composer">
      <div id="mention-pop"></div>
      <textarea id="composer-input" rows="1" placeholder="지시를 입력하세요.  @ 로 담당자를 지정합니다."></textarea>
      <button id="composer-send" onclick="sendMessage()">
        <span class="cs-label">보내기</span><span class="cs-hint">Enter</span>
      </button>
    </div>
  </div>
</div>

<div id="dashboard" class="collapsed">
  <div id="dash-header" onclick="toggleDashboard()">
    <h3>Agent Dashboard <span id="dash-summary" class="dash-summary"></span></h3>
    <button class="toggle-btn" id="dash-toggle">Expand</button>
  </div>
  <div id="dash-cards"></div>
</div>

<div id="controls">
  <span class="ctrl-label">프리셋</span>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="profile-modal" id="profile-modal"></div>
</div>
<div id="error-vignette"></div>

<script src="/static/office.js"></script>
</body>
</html>
