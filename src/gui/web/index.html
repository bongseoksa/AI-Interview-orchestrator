<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Office</title>
<link rel="stylesheet" href="/static/office.css">
</head>
<body>

<div id="header">
  <h1>AI Interview Office</h1>
  <span class="stat" id="timer"></span>
  <span class="stat" id="tokens"></span>
  <span class="stat" id="conn-status">connecting...</span>
</div>

<div id="main">
  <div id="floor">
    <div class="zone" id="zone-work"><span class="zone-label">Work Room</span><div class="zone-agents" id="work-agents"></div></div>
    <div class="zone" id="zone-meeting"><span class="zone-label">Meeting Room</span><div id="meeting-info"><div class="mi-crew" id="meeting-crew">No active crew</div></div><div class="zone-agents" id="meeting-agents"></div></div>
    <div class="zone" id="zone-lounge"><span class="zone-label">Lounge</span><div class="zone-agents" id="lounge-agents"></div></div>
  </div>
  <div id="messenger">
    <div id="messenger-header">
      <h3>Office Messenger</h3>
      <div class="font-controls">
        <button onclick="changeFontSize(-1)">A-</button>
        <button onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div id="msg-list"></div>
    <button id="scroll-btn" onclick="scrollToBottom()">Latest</button>
  </div>
</div>

<div id="dashboard" class="expanded">
  <div id="dash-header" onclick="toggleDashboard()">
    <h3>Agent Dashboard <span id="dash-summary" class="dash-summary"></span></h3>
    <button class="toggle-btn" id="dash-toggle">Collapse</button>
  </div>
  <div id="dash-cards"></div>
</div>

<div id="controls">
  <span style="color:var(--dim);font-size:11px;margin-right:8px;">Crews:</span>
</div>

<script src="/static/office.js"></script>
</body>
</html>
